name: Build desktop app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Enable desktop platform
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - run: flutter build ${{ matrix.platform }} --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytd-m3-${{ matrix.platform }}
          path: |
            build/linux/x64/release/bundle
            build/macos/Build/Products/Release/ytd_m3.app
            build/windows/x64/runner/Release
          if-no-files-found: ignore
