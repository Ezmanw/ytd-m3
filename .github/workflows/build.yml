name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            deb_arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            deb_arch: arm64
          - os: macos-latest
            platform: macos
            arch: universal
          - os: windows-latest
            platform: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      # subosito/flutter-action's release-manifest lookup has no arm64 Linux
      # entry (fails with "Unable to determine Flutter version ... architecture:
      # arm64") even though Flutter itself supports arm64 Linux hosts fine, so
      # Linux legs install Flutter directly from git instead of via the action.
      - name: Install Flutter (git, Linux)
        if: matrix.platform == 'linux'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - uses: subosito/flutter-action@v2
        if: matrix.platform != 'linux'
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Enable desktop platform
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - run: flutter build ${{ matrix.platform }} --release

      - name: Package Linux .deb and .rpm
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          BUNDLE=build/linux/x64/release/bundle
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/opt/ytd-m3" "$STAGE/usr/bin" "$STAGE/usr/share/applications"
          cp -r "$BUNDLE"/. "$STAGE/opt/ytd-m3/"
          ln -s /opt/ytd-m3/ytd_m3 "$STAGE/usr/bin/ytd-m3"
          cat > "$STAGE/usr/share/applications/ytd-m3.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=YTD M3
          Comment=Material 3 desktop client for local and remote download servers
          Exec=/opt/ytd-m3/ytd_m3
          Icon=applications-internet
          Categories=Utility;Network;
          Terminal=false
          EOF
          mkdir -p dist
          fpm -s dir -t deb -C "$STAGE" -n ytd-m3 -v "$VERSION" -a "${{ matrix.deb_arch }}" \
            --description "YTD M3 — Material 3 desktop client for local and remote download servers" \
            --license "See repository" --url "https://github.com/${{ github.repository }}" \
            -p "dist/ytd-m3_${VERSION}_${{ matrix.deb_arch }}.deb" .
          fpm -s dir -t rpm -C "$STAGE" -n ytd-m3 -v "$VERSION" -a "${{ matrix.arch }}" \
            --description "YTD M3 — Material 3 desktop client for local and remote download servers" \
            --license "See repository" --url "https://github.com/${{ github.repository }}" \
            -p "dist/ytd-m3-${VERSION}-${{ matrix.arch }}.rpm" .

      - name: Upload raw bundle
        uses: actions/upload-artifact@v4
        with:
          name: ytd-m3-${{ matrix.platform }}-${{ matrix.arch }}-bundle
          path: |
            build/linux/x64/release/bundle
            build/macos/Build/Products/Release/ytd_m3.app
            build/windows/x64/runner/Release
          if-no-files-found: ignore

      - name: Upload Linux packages
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ytd-m3-linux-${{ matrix.arch }}-packages
          path: dist/*

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ytd-m3-android
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts for release
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.apk' \) -exec cp {} release/ \;
          for dir in artifacts/*-bundle; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../release/${name}.zip" .)
          done
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
