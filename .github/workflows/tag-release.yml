name: Tag release

# Creates and pushes a git tag using the workflow's own GITHUB_TOKEN, which
# has full repo write access — unlike some external push credentials, it can
# create tag refs. Pushing the resulting `v*` tag triggers the `release` job
# in build.yml, which attaches every platform build to a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and push (e.g. v1.0.0)'
        required: true
        default: v1.0.0
      force:
        description: 'Move the tag if it already exists, pointing it at the current commit'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          FORCE="${{ inputs.force }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            if [ "$FORCE" != "true" ]; then
              echo "Tag $TAG already exists, nothing to do (pass force: true to move it)."
              exit 0
            fi
            echo "Force-moving existing tag $TAG"
            git tag -d "$TAG"
            git push origin ":refs/tags/$TAG"
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
